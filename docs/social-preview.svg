<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Libellule — See everything. Share only what matters.</title>
  <desc id="description">The Libellule dragonfly app icon alongside its capture, annotation, text extraction and redaction features. Everything stays on your Mac.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101b2b"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#4f6be8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4f6be8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#72e4df"/>
      <stop offset="1" stop-color="#a3b8ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#72e4df" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a3b8ff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <ellipse cx="1050" cy="285" rx="470" ry="420" fill="url(#glow)"/>

  <!-- Viewfinder corners echo the existing app icon. -->
  <g fill="none" stroke="#86b4d7" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round">
    <path d="M32 76 V48 Q32 32 48 32 H76"/>
    <path d="M1204 32 H1232 Q1248 32 1248 48 V76"/>
    <path d="M1248 564 V592 Q1248 608 1232 608 H1204"/>
    <path d="M76 608 H48 Q32 608 32 592 V564"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="94" cy="94" r="5" fill="#72e4df"/>
    <text x="112" y="99" fill="#b4c6d8" font-size="14" font-weight="600" letter-spacing="2.2">THE PRIVATE SCREENSHOT STUDIO</text>

    <text x="86" y="221" fill="#f5f8ff" font-size="96" font-weight="700" letter-spacing="-4">Libellule</text>
    <g font-size="44" font-weight="500" letter-spacing="-1.2">
      <text x="88" y="303" fill="#f5f8ff">See everything.</text>
      <text x="88" y="359" fill="url(#accent)">Share only what matters.</text>
    </g>

    <text x="88" y="420" fill="#a8b7cb" font-size="21" font-weight="400">Capture <tspan fill="#557086">·</tspan> Annotate <tspan fill="#557086">·</tspan> Copy text <tspan fill="#557086">·</tspan> Redact</text>

    <!-- Keep the original rendered app icon, including its glass finish. -->
    <image href="icon.png" x="904" y="158" width="288" height="288" filter="url(#shadow)"/>

    <path d="M88 480 H1192" stroke="url(#rule)"/>

    <g transform="translate(89 519)" fill="none" stroke="#72e4df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="8" width="15" height="12" rx="3"/>
      <path d="M3 8 V5 a4.5 4.5 0 0 1 9 0 V8"/>
      <path d="M7.5 13 V15"/>
    </g>
    <text x="118" y="536" fill="#dae5f2" font-size="18" font-weight="500">Everything stays on your Mac.</text>
    <text x="1192" y="536" fill="#93a7bf" font-size="16" text-anchor="end">github.com/timdeschryver/Libellule</text>
  </g>
</svg>
