# Builds Libellule, signs it ad hoc, packages it as a zip and a disk image and
# attaches both with their SHA-256 checksums to a GitHub release, then points
# the Homebrew cask in Casks/ at the new version.
#
# Push a tag such as v1.2.0, or publish a release on GitHub, to build and attach
# the app to that release. Run it by hand from the
# Actions tab to check the build without releasing: the app is then kept as a
# workflow artifact instead.
#
# The builds are signed ad hoc rather than with a Developer ID certificate,
# which needs a paid Apple Developer Program membership, so they aren't
# notarized either. macOS blocks a downloaded copy until it is allowed under
# System Settings → Privacy & Security, and because an ad hoc signature changes
# with every build, the Screen Recording permission has to be granted again
# after each update.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Naming the shell makes every step run with pipefail, so a failing command in a pipeline (the
# checksums) fails the step instead of being masked by the command after it.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # Xcode 27 isn't on the macos-26 image, and the project needs it.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Pick the version and the paths
        run: |
          xcodebuild -version
          # The runner context can't be used in a job-level env, so the paths under the runner's
          # temporary directory are exported here for the steps that follow.
          echo "ARCHIVE=$RUNNER_TEMP/Libellule.xcarchive" >> "$GITHUB_ENV"
          echo "APP=$RUNNER_TEMP/Libellule.xcarchive/Products/Applications/Libellule.app" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Release tags look like v1.2 or v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            echo "VERSION=$version" >> "$GITHUB_ENV"
            echo "ZIP=Libellule-$version.zip" >> "$GITHUB_ENV"
            echo "DMG=Libellule-$version.dmg" >> "$GITHUB_ENV"
          else
            echo "ZIP=Libellule-${GITHUB_SHA::7}.zip" >> "$GITHUB_ENV"
            echo "DMG=Libellule-${GITHUB_SHA::7}.dmg" >> "$GITHUB_ENV"
          fi

      - name: Run the tests
        run: |
          xcodebuild test \
            -project Libellule.xcodeproj -scheme Libellule \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/test" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Archive
        run: |
          xcodebuild archive \
            -project Libellule.xcodeproj -scheme Libellule -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ${VERSION:+MARKETING_VERSION=$VERSION}
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

          # A disk image with the app and an Applications shortcut, for the Homebrew cask and for
          # anyone who prefers one.
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto "$APP" "$staging/Libellule.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Libellule -srcfolder "$staging" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist: publishing one from the GitHub website creates the tag
          # that starts this workflow, and a re-run finds the release an earlier run made. Then only
          # the files are (re)attached, and the title and notes are left alone.
          assets=("$ZIP" "$ZIP.sha256" "$DMG" "$DMG.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "Libellule $VERSION" --generate-notes
          fi

      - name: Point the Homebrew cask at the release
        if: github.ref_type == 'tag'
        run: |
          sha="$(cut -d' ' -f1 "$DMG.sha256")"
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            -e "s|github.com/[^/]*/[^/]*/releases/download|github.com/$GITHUB_REPOSITORY/releases/download|" \
            -e "s|homepage \"https://github.com/[^\"]*\"|homepage \"https://github.com/$GITHUB_REPOSITORY\"|" \
            Casks/libellule.rb
          if git diff --quiet -- Casks/libellule.rb; then
            echo "The cask already points at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point the Homebrew cask at $VERSION"
          git push origin main

      - name: Keep the app
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Libellule
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
