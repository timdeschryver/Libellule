# Builds Libellule and runs its tests on every push to main and on every pull request, so a
# change that breaks the build or a test shows up long before it is released. Changes that only
# touch the docs or the Homebrew cask are skipped. Archiving, packaging and publishing stay in
# release.yml.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "Casks/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "Casks/**"]
  workflow_dispatch:

permissions:
  contents: read

# Naming the shell makes every step run with pipefail.
defaults:
  run:
    shell: bash

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 27 isn't on the macos-26 image, and the project needs it.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Build and run the tests
        run: |
          xcodebuild -version
          xcodebuild test \
            -project Libellule.xcodeproj -scheme Libellule \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/test" \
            -resultBundlePath Tests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      # The result bundle holds the failure messages and the logs; open it in Xcode.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: Tests.xcresult
